x-logging: &logging
  driver: journald
  options:
    cache-disabled: "true"

services:
  server:
    environment:
      BP_COMPUTE_URL: http://workerd:8080
      BP_COMPUTE_TOKEN: ${BP_COMPUTE_TOKEN:?required}
      BP_COMPUTE_TIMEOUT_MS: ${BP_COMPUTE_TIMEOUT_MS:-10000}
      BP_WORKERD_RUNTIME_ID: workerd-binary-sha256:${BP_WORKERD_BINARY_SHA256:-f31da6d248028d698806aa93d1b3aec28bbd4b4b7ddc31e967408ab6406fa5aa}
  workerd:
    # Bootstrap pulls and verifies this published default; compose.dev.yaml builds the recipe instead.
    image: ${BP_WORKERD_EFFECTIVE_IMAGE:-${BP_WORKERD_IMAGE:-ghcr.io/autonomiceng/agent-backplane-workerd:main-91de7da@sha256:9949989b11d68f62229c90bbcc8afb9fd4384d8eb90f09c67acc692d6a45e686}}
    profiles: [compute]
    entrypoint: ["/bin/sh", "/compute/start.sh"]
    command: []
    restart: unless-stopped
    logging: *logging
    environment:
      BP_COMPUTE_TOKEN: ${BP_COMPUTE_TOKEN:?required}
      BP_COMPUTE_TIMEOUT_MS: ${BP_COMPUTE_TIMEOUT_MS:-10000}
      BP_WORKERD_IMAGE: ${BP_WORKERD_IMAGE:-ghcr.io/autonomiceng/agent-backplane-workerd:main-91de7da@sha256:9949989b11d68f62229c90bbcc8afb9fd4384d8eb90f09c67acc692d6a45e686}
      BP_WORKERD_HOST_IMAGE_ID: ${BP_WORKERD_HOST_IMAGE_ID:-}
      BP_WORKERD_BINARY_SHA256: ${BP_WORKERD_BINARY_SHA256:-f31da6d248028d698806aa93d1b3aec28bbd4b4b7ddc31e967408ab6406fa5aa}
      BP_WORKERD_DIGEST: ${BP_WORKERD_DIGEST:-}
      BP_WORKERD_REPOSITORY: ${BP_WORKERD_REPOSITORY:-}
    volumes:
      - ./apps/server/compute/workerd:/compute:ro
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1
    pids_limit: 128
