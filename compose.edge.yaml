x-logging: &logging
  driver: journald
  options:
    cache-disabled: "true"

services:
  edge:
    image: ${BP_CADDY_IMAGE:-caddy:2.11.4@sha256:13ba145cba2f3e28fa801994876e4c086d1b95d5aa2a520a734765ffb6b12017}
    profiles: [edge]
    restart: unless-stopped
    # Reap orphaned watchdogs from bounded status probes.
    init: true
    logging: *logging
    mem_limit: 256m
    mem_reservation: 64m
    depends_on:
      server:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        case "$$BP_ACCESS_MODE" in local|public) ;; *) echo "Standalone edge requires local or public mode" >&2; exit 1;; esac
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    environment:
      BP_ACCESS_MODE: ${BP_ACCESS_MODE:-local}
      BP_EDGE_HOST: backplane.${BP_PUBLIC_DOMAIN:-localhost}
      BP_PUBLIC_URL: ${BP_PUBLIC_URL:?run scripts/bootstrap.py to set the browser URL}
      BP_RUSTFS_CONSOLE: ${BP_RUSTFS_CONSOLE:-false}
      BP_RUSTFS_HOST: ${BP_RUSTFS_HOST:-rustfs.${BP_PUBLIC_DOMAIN:-localhost}}
      BP_RUSTFS_URL_HOST: ${BP_RUSTFS_URL_HOST:-unused.invalid}
      BP_RUSTFS_AUTHORITY: ${BP_RUSTFS_AUTHORITY:-}
      BP_RUSTFS_URL: ${BP_RUSTFS_URL:-https://${BP_RUSTFS_HOST:-rustfs.${BP_PUBLIC_DOMAIN:-localhost}}:${BP_HTTPS_PORT:-443}}
      BP_RUSTFS_CONSOLE_ALLOW: ${BP_RUSTFS_CONSOLE_ALLOW:-127.0.0.1/8 ::1}
      BP_TRUSTED_PROXIES: ${BP_TRUSTED_PROXIES:-172.30.0.2/32}
    ports:
      - "${BP_BIND_HOST:-127.0.0.1}:${BP_HTTP_PORT:-80}:80"
      - "${BP_BIND_HOST:-127.0.0.1}:${BP_HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/compose/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${BP_STATUS_DIR:-./data}/console:/srv/status:ro
      - edge-data:/data
      - edge-config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      default:
      blob-internal:
      platform:
        aliases: [bp-gateway]

volumes:
  edge-data:
    external: true
    name: ${BP_VOLUME_PREFIX:-agent-backplane}_edge-data
  edge-config:
    external: true
    name: ${BP_VOLUME_PREFIX:-agent-backplane}_edge-config

networks:
  blob-internal:
    internal: true
