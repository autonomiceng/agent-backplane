# Core: Postgres 18 with PGMQ and the backplane server serving API, SSE and dashboard.
# Optional blobs, compute and edge profiles are added as root-level overlays.
name: agent-backplane

x-logging: &logging
  driver: journald
  options:
    cache-disabled: "true"

services:
  postgres:
    # scripts/bootstrap.py creates the backup repository's archive and backups directories.
    image: &postgres-image ${BP_POSTGRES_IMAGE:-postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280}
    restart: unless-stopped
    logging: *logging
    mem_limit: 4g
    mem_reservation: 1g
    pids_limit: 256
    command:
      - postgres
      - -c
      - logging_collector=off
      - -c
      - log_destination=stderr
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=/backup-tools/archive.sh "%p" "%f" /backup/archive
    environment:
      POSTGRES_DB: backplane
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${BP_POSTGRES_ADMIN_PASSWORD:?generate with scripts/bootstrap.py}
      BP_POSTGRES_PASSWORD: ${BP_POSTGRES_PASSWORD:?generate with scripts/bootstrap.py}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/init/core:/docker-entrypoint-initdb.d:ro
      - ./infra/backup:/backup-tools:ro
      - ${BP_BACKUP_DIR:?set BP_BACKUP_DIR to an encrypted off-host repository mount}:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d backplane"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    # Published by .github/workflows/publish.yml; compose.dev.yaml builds this checkout instead.
    image: &server-image ${BP_SERVER_IMAGE:-ghcr.io/autonomiceng/agent-backplane-server:main-c628063@sha256:2b94e6494f1f16d1a957323a79415fe0f5e3ad67d38ecfef8275f8e2efb962a4}
    restart: "no"
    logging: *logging
    command: ["bun", "db/migrate-cli.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BP_ADMIN_DATABASE_URL: postgres://postgres:${BP_POSTGRES_ADMIN_PASSWORD:?generate with scripts/bootstrap.py}@postgres:5432/backplane

  storage-init:
    image: *server-image
    restart: "no"
    logging: *logging
    # Root only to give bun the server data (fresh, restored or written by a root helper), then
    # setpriv from the Debian base drops to bun. The server starts after this completes.
    user: "0:0"
    entrypoint: ["sh", "-ec", "chown -R bun:bun /data; exec setpriv --reuid=bun --regid=bun --init-groups -- \"$$@\"", "storage-init"]
    command: ["bun", "apps/server/blobs/storage-admin.ts", "initialize"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      BP_ADMIN_DATABASE_URL: postgres://postgres:${BP_POSTGRES_ADMIN_PASSWORD:?generate with scripts/bootstrap.py}@postgres:5432/backplane
      BP_DATA_DIR: /data
    volumes:
      - server-data:/data

  server:
    image: *server-image
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *logging
    mem_limit: 2g
    mem_reservation: 512m
    environment:
      BP_DATABASE_URL: postgres://bp_server:${BP_POSTGRES_PASSWORD:?generate with scripts/bootstrap.py}@postgres:5432/backplane
      NODE_ENV: production
      BP_RETENTION_PURGE_INTERVAL: ${BP_RETENTION_PURGE_INTERVAL:-1h}
      BP_PORT: 3000
      BP_DATA_DIR: /data
      BP_OPERATIONS_TOKEN: ${BP_OPERATIONS_TOKEN:-}
      BP_BACKUP_KEEP: ${BP_BACKUP_KEEP:-7}
      BP_STARTUP_VERIFY_TIMEOUT: ${BP_STARTUP_VERIFY_TIMEOUT:-120}
      BP_BACKUP_DIR: /backups
      BP_AUTH_SECRET: ${BP_AUTH_SECRET:?set BP_AUTH_SECRET to a random string of at least 32 characters}
      BP_ACCESS_MODE: ${BP_ACCESS_MODE:-local}
      BP_PUBLIC_URL: ${BP_PUBLIC_URL:-}
      BP_AUTH_URL: ${BP_AUTH_URL:-}
      BP_SIGNUP: ${BP_SIGNUP:-closed}
      # Configured image references for the public Status Document (GET /status.json); the
      # optional pins repeat their overlay defaults so a core install can report them disabled.
      BP_SERVER_IMAGE: *server-image
      BP_POSTGRES_IMAGE: *postgres-image
      BP_RUSTFS_IMAGE: ${BP_RUSTFS_IMAGE:-rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff}
      BP_WORKERD_IMAGE: ${BP_WORKERD_IMAGE:-ghcr.io/autonomiceng/agent-backplane-workerd:main-91de7da@sha256:9949989b11d68f62229c90bbcc8afb9fd4384d8eb90f09c67acc692d6a45e686}
      BP_CADDY_IMAGE: ${BP_CADDY_IMAGE:-caddy:2.11.4@sha256:13ba145cba2f3e28fa801994876e4c086d1b95d5aa2a520a734765ffb6b12017}
    volumes:
      - server-data:/data
      - ${BP_BACKUP_DIR:?set BP_BACKUP_DIR to an encrypted off-host repository mount}/backups:/backups:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health/ready || exit 1"]
      start_period: ${BP_STARTUP_VERIFY_TIMEOUT:-120}s
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${BP_PORT:-3000}:3000"
    networks:
      default:
      platform:
        aliases: [bp-server]

volumes:
  postgres-data:
    external: true
    name: ${BP_VOLUME_PREFIX:-agent-backplane}_postgres-data
  server-data:
    external: true
    name: ${BP_VOLUME_PREFIX:-agent-backplane}_server-data

networks:
  default:
  platform:
    name: ${BP_PLATFORM_NETWORK:-platform}
    external: true
