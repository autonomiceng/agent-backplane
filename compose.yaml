# Core: Postgres 18 with PGMQ and the backplane server serving API, SSE and dashboard.
# Optional blobs, compute and edge profiles are added as root-level overlays.
name: agent-backplane

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backup-init:
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    user: "0:0"
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - mkdir -p /backup/archive /backup/backups && chown postgres:postgres /backup/archive /backup/backups
    volumes:
      - ${BP_BACKUP_DIR:?set BP_BACKUP_DIR to an encrypted off-host repository mount}:/backup

  postgres:
    depends_on:
      backup-init:
        condition: service_completed_successfully
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    restart: unless-stopped
    logging: *logging
    mem_limit: 4g
    mem_reservation: 1g
    pids_limit: 256
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=/backup-tools/archive.sh "%p" "%f" /backup/archive
    environment:
      POSTGRES_DB: backplane
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${BP_POSTGRES_ADMIN_PASSWORD:?generate with infra/bootstrap/prepare.ts}
      BP_POSTGRES_PASSWORD: ${BP_POSTGRES_PASSWORD:?generate with infra/bootstrap/prepare.ts}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/init/core:/docker-entrypoint-initdb.d:ro
      - ./infra/backup:/backup-tools:ro
      - ${BP_BACKUP_DIR:?set BP_BACKUP_DIR to an encrypted off-host repository mount}:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d backplane"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: ${BP_SERVER_IMAGE:-agent-backplane-server:local}
    build: &server-build
      context: .
      dockerfile: infra/compose/server.Dockerfile
    restart: "no"
    command: ["bun", "db/migrate-cli.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BP_ADMIN_DATABASE_URL: postgres://postgres:${BP_POSTGRES_ADMIN_PASSWORD:?generate with infra/bootstrap/prepare.ts}@postgres:5432/backplane

  data-init:
    image: ${BP_SERVER_IMAGE:-agent-backplane-server:local}
    build: *server-build
    user: "0:0"
    restart: "no"
    network_mode: none
    command: ["sh", "-ec", "chown -R bun:bun /data"]
    volumes:
      - server-data:/data

  server:
    image: ${BP_SERVER_IMAGE:-agent-backplane-server:local}
    build: *server-build
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      data-init:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *logging
    mem_limit: 2g
    mem_reservation: 512m
    environment:
      BP_DATABASE_URL: postgres://bp_server:${BP_POSTGRES_PASSWORD:?generate with infra/bootstrap/prepare.ts}@postgres:5432/backplane
      NODE_ENV: production
      BP_RETENTION_PURGE_INTERVAL: ${BP_RETENTION_PURGE_INTERVAL:-1h}
      BP_PORT: 3000
      BP_DATA_DIR: /data
      BP_OPERATIONS_TOKEN: ${BP_OPERATIONS_TOKEN:-}
      BP_BACKUP_KEEP: ${BP_BACKUP_KEEP:-7}
      BP_BACKUP_DIR: /backups
      BP_AUTH_SECRET: ${BP_AUTH_SECRET:?set BP_AUTH_SECRET to a random string of at least 32 characters}
      BP_PUBLIC_URL: ${BP_PUBLIC_URL:-${BP_AUTH_URL:-http://localhost:${BP_PORT:-3000}}}
      BP_AUTH_URL: ${BP_AUTH_URL:-}
      BP_SIGNUP: ${BP_SIGNUP:-closed}
    volumes:
      - server-data:/data
      - ${BP_BACKUP_DIR:?set BP_BACKUP_DIR to an encrypted off-host repository mount}/backups:/backups:ro
      - ${BP_ARCHIVE_DIR:-./.archive}:/archive:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${BP_PORT:-3000}:3000"
    networks:
      default:
      platform:
        aliases: [bp-server]

volumes:
  postgres-data:
    external: true
    name: ${BP_VOLUME_PREFIX:-agent-backplane}_postgres-data
  server-data:
    external: true
    name: ${BP_VOLUME_PREFIX:-agent-backplane}_server-data

networks:
  default:
  platform:
    name: ${BP_PLATFORM_NETWORK:-platform}
    external: true
