name: Bug report
description: Report something that did not work.
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: Include the steps to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Redact secrets, keys, passwords, credentials and private data before posting.
      render: text
