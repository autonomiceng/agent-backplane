name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    # Serialized image builds, real storage/runtime gates and two physical recovery drills.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Check out canonical conventions and UI kit
        run: |
          git clone --filter=blob:none --no-tags --single-branch \
            https://github.com/autonomiceng/platform-edge.git "$RUNNER_TEMP/platform-edge"
          git -C "$RUNNER_TEMP/platform-edge" checkout --detach df1df93e18f3c56eb2234f7d04f23e996f36e611
      - run: bun run check
        env:
          PLATFORM_EDGE_DIR: ${{ runner.temp }}/platform-edge
      - run: python3 -m unittest discover -s tests -p 'test_bootstrap*.py'
      - name: Validate isolated bootstrap plan
        run: |
          render_dir="$(mktemp -d "$RUNNER_TEMP/backplane-render.XXXXXX")"
          trap 'rm -rf "$render_dir"' EXIT
          python3 - "$render_dir" <<'PY'
          import os
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          template = Path('.env.example').read_text()
          for key, value in {
              'BP_DATA_DIR': root / 'data',
              'BP_BACKUP_DIR': root / 'backups',
          }.items():
              old = f'{key}=' + ('./data' if key == 'BP_DATA_DIR' else '')
              assert template.count(old + '\n') == 1
              template = template.replace(old + '\n', f'{key}={value}\n', 1)
          env_file = root / '.env'
          env_file.write_text(template)
          os.chmod(env_file, 0o600)
          PY
          cp "$render_dir/.env" "$render_dir/.env.before"
          XDG_STATE_HOME="$render_dir/state" python3 scripts/bootstrap.py --dry-run --env-file "$render_dir/.env" \
            --capability-file "$render_dir/capability" --compose-project backplane-ci-render \
            > "$render_dir/plan.json"
          cmp "$render_dir/.env.before" "$render_dir/.env"
          test ! -e "$render_dir/.env.lock"
          test ! -e "$render_dir/capability"
          test ! -e "$render_dir/data"
          test ! -e "$render_dir/backups"
          test ! -e "$render_dir/state"
          python3 - "$render_dir" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          plan = json.loads((root / 'plan.json').read_text())
          assert plan['dryRun'] is True
          assert plan['envFile'] == str(root / '.env')
          assert plan['project'] == 'backplane-ci-render'
          assert plan['profiles'] == []
          assert plan['backupDir'] == str(root / 'backups')
          PY
      # Tests start embedded PostgreSQL; no service container is needed.
      # Host rollout acceptance stays separate; the isolated storage/runtime gates run below.
      - run: bun run test
      - run: bun run test:examples
      - run: bun tests/acceptance/storage-startup.ts
      - run: bun tests/acceptance/storage-identity.ts
      - run: docker build -f infra/compose/server.Dockerfile .
      - run: docker build --platform linux/amd64 -f infra/compute/image/Dockerfile -t agent-backplane-workerd:1.20260918.1 infra/compute/image
      - run: bun tests/acceptance/workerd-image.ts agent-backplane-workerd:1.20260918.1 --lifecycle
      - run: python3 tests/acceptance/workerd-gate.py agent-backplane-workerd:1.20260918.1
      - run: python3 scripts/backup-drill.py --offline
      - run: python3 scripts/backup-drill.py --s3
