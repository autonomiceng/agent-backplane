name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run check
      # Tests start embedded PostgreSQL; no service container is needed.
      # Docker acceptance scripts require a prepared deployment and run outside CI.
      - run: bun run test
      - run: docker build -f infra/compose/server.Dockerfile .
