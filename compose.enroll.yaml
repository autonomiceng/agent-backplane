# First-User enrollment with the CLI inside the server image, so Bun never runs on the host.
# scripts/bootstrap.py prints the exact `run` line: it selects the image the server runs through
# BP_SERVER_IMAGE, mounts the capability file read-only under /tmp (the CLI accepts a root-owned
# sticky parent) and the operator's CLI state directory at its own path, and runs as the operator's
# uid so the credential file lands on the host owned by them. Never listed in COMPOSE_FILE;
# `docker compose up` ignores it.
services:
  enroll:
    image: ${BP_SERVER_IMAGE:-ghcr.io/autonomiceng/agent-backplane-server:main-f59d65f@sha256:93eb37b3810c7affc59d6ca38a0598da119f4ba8e51aaf1856f01354f99d4f1d}
    profiles: [enroll]
    # The host's loopback and DNS: --url is the same browser URL agents on this host use.
    network_mode: host
    entrypoint: ["bun", "packages/cli/runtime/main.ts", "bootstrap", "--capability-file", "/tmp/capability"]
    environment:
      # Passed through only when set in the operator's shell; unset keeps the terminal prompt.
      - BP_BOOTSTRAP_PASSWORD
